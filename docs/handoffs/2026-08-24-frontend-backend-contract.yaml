handoff:
  status: READY_FOR_REVIEW
  from: "Claude Code (contract alignment session)"
  to: "erdemdnmz2"
  created_at: "2026-08-24T14:00:00Z"
  task: "Arayüzün yürürlükteki backend sözleşmesine bağlanması (branch: redesign/frontend-design-system)"

  finding:
    summary: >
      Arayüzde sabit kodlanmış sahte veri yoktu. Sorun, arayüzün backend'in
      artık kullanmadığı bir API sözleşmesiyle konuşuyor olmasıydı. Backend
      UUID tabanlı hedef erişimine geçmiş, arayüz eski servername/database_name
      sözleşmesinde kalmıştı. Bu haliyle sorgu çalıştırma, maskeleme kuralı
      okuma ve çalışma alanı oluşturma çağrılarının hepsi 422 alırdı.
    drift:
      - "POST /api/execute_query: db_uuid ister; arayüz servername + database_name gönderiyordu"
      - "GET /api/masking_rules: db_uuid ister; arayüz servername + database_name gönderiyordu"
      - "GET /api/database_information: databases artık {name, uuid} nesnesi; arayüz string bekliyordu"
      - "POST /api/workspaces: {name, description?, query, db_uuid} ister ve {success, workspace_id} döndürür"
      - "PUT /api/workspaces/{id}: yalnız {query, status?} kabul eder; diğer alanlar sessizce yok sayılıyordu"
      - "GET /api/me: email döndürmez; arayüz hesap menüsünde gösteriyordu"
      - "SQLResponse: row_count/truncated alanları yok; bilgi message metninin içinde"
      - "Servis hatası zarfı: error_code ve trace_id kullanılmıyordu"

  scope:
    completed:
      - "types.ts backend Pydantic şemalarına birebir hizalandı"
      - "services/api.ts yürürlükteki endpoint sözleşmesine göre yeniden yazıldı"
      - "lib/targets.ts: db_uuid <-> sunucu/veritabanı çözümlemesi"
      - "lib/execution.ts: SQLResponse -> ExecutionOutcome adaptörü, message ayrıştırma"
      - "ApiError artık error_code ve trace_id taşıyor"
      - "QUERY_REJECTED_BY_ANALYZER hata değil, 'onaya gönderildi' bekleme durumu olarak gösteriliyor"
      - "Yetkisiz kullanıcı ve erişilemeyen çalışma alanı hedefi için açık durum mesajları"
      - "scripts/api-contract-audit.mjs ve npm run audit:api eklendi"
      - "DESIGN.md'ye 'Backend sözleşmesi' bölümü eklendi"
    excluded:
      - "Backend: hiçbir dosya değiştirilmedi"
      - "POST /api/multiple_query: arayüz ihtiyacı yok"
      - "POST /api/admin/associate_user: aşağıdaki engel nedeniyle yapılmadı"

  blocked:
    - item: "Yönetici tarafından kullanıcıya veritabanı yetkisi verme ekranı"
      endpoint: "POST /api/admin/associate_user"
      reason: >
        Endpoint sayısal user_id ister. Backend'de kullanıcı listeleyen veya
        e-posta/kullanıcı adından kimlik çözen bir endpoint yok, dolayısıyla
        arayüz bir kullanıcı seçici sunamaz. Yöneticinin sayısal kimlik yazdığı
        bir form üretmek yerine akış dışarıda bırakıldı.
      impact: >
        Yetkilendirme olmadan GET /api/database_information her kullanıcı için
        boş döner ve GET /api/me is_admin=false verir. Yeni kurulumda ilk
        yetkilendirme hâlâ arayüz dışından yapılmalıdır.
      unblocked_by: "Kullanıcıları listeleyen admin-only bir endpoint (örn. GET /api/admin/users)"

  bug_fixed:
