      - "AuditLog şeması, saklama politikası ve shell scriptlerdeki operatör odaklı echo çıktıları kapsam dışıdır."
      - "docs/open-questions.md, webquery_implementasyon_sirasi.md ve docs/inbox/OPTIONAL-DESTRUCTIVE-DML-CONFIRMATION.md üzerindeki mevcut kullanıcı değişiklikleri korunmuş, bu adıma dahil edilmemiştir."

