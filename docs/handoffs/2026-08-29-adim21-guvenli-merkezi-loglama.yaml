      - "LOG_LEVEL desteği eklendi; geçersiz değer INFO'ya düşer ve uyarı kaydı üretilir."
      - "DatabaseProvider katalog güncellemesi yalnız sunucu ve veritabanı sayılarını DEBUG seviyesinde kaydeder; sunucu, veritabanı, UUID ve credential değerlerini kaydetmez."
      - "DB bootstrap'ta SQLAlchemy echo kapatıldı; CREATE LOGIN parola literalinin loglanma riski kaldırıldı."
      - "Trace ve authentication hata kayıtları ham exception/traceback yerine güvenli işlem özeti ve exception türünü kullanır."
      - "SPEC-0020 ve print/loglama davranışını koruyan regresyon testleri eklendi; eski stdout bekleyen şema koruma testi log sözleşmesine uyarlandı."
    excluded:
