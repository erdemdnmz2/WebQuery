  known_risks:
    - "NOTHING IS COMMITTED. The ~116-file diff is still entirely in the
       working tree, exactly as it was at the previous handoff. This is the
       single largest risk to the work: a crash or a lost worktree loses all
       of it. Recommend committing in logical chunks (per P-item or per group)
       rather than one giant commit, both for reviewability and as a
       checkpoint."
    - "The three migrations (a1b2c3d4e5f6, b2c3d4e5f6a7, and the earlier
       baseline repair) have only ever run against SQLite. The project's own
       stated testing gap applies to them, and they touch real tables
       (BlacklistedTokens drop, MaskingRule unique constraint, Databases
       lifecycle columns). Run them against a staging MSSQL instance before
       deploying."
    - "docker-compose.yml's TRUSTED_PROXY_IPS default (172.16.0.0/12) is a
