      - docs/specs/SPEC-0025-dead-code-removal.md
      - docs/specs/SPEC-0026-deployment-hardening.md
      - docs/specs/SPEC-0027-target-database-lifecycle.md
      - docs/handoffs/2026-08-29-audit-remediation-p0-p1-p2.yaml (this file)
    deleted:
      - web_api/static_files/__init__.py
      - web_api/static_files/router.py
    modified: >
      ~110 files. Run `git status --short` for the exact list. Notable
      documentation edits beyond the new files: README.md (rewritten),
      .github/workflows/ci.yml (restructured), docs/adr/ADR-0002 (amended),
      docs/adr/ADR-0009 (amended), docs/open-questions.md (OQ-2026-001
      answer updated).

  decisions:
    - decision: "Remove POST /api/multiple_query entirely rather than adding
        a rate limit to it."
      rationale: "No frontend caller existed; keeping an unused, newly-limited
        execution surface was worse than removing it."
      recorded_in: "docs/specs/SPEC-0022-audit-remediation-p0.md"
    - decision: "Masking enforcement becomes table-aware; masking_type is
        constrained to 'full' only."
      rationale: "The stored (table_name, masking_type) were ignored at read
        time, causing over-masking across tables and promising a masking_type
        the engine never implemented."
      recorded_in: "docs/specs/SPEC-0024-table-aware-masking.md,
        docs/adr/ADR-0018-table-aware-masking-enforcement.md"
    - decision: "Remove the dead BlacklistedToken/JTI mechanism rather than
        wiring it up."
      rationale: "ADR-0008's server-side UserSessions + rotating refresh
        already covers revocation; mint_access never set a jti so the table
        was never written."
      recorded_in: "docs/specs/SPEC-0025-dead-code-removal.md"
    - decision: "docker-compose.yml becomes production-safe; dev conveniences
        move to docker-compose.override.yml."
      rationale: "Compose auto-loads the override file, so local `docker
        compose up` is unchanged; a deploy running `-f docker-compose.yml`
        gets the hardened version with no code change."
      recorded_in: "docs/specs/SPEC-0026-deployment-hardening.md"
    - decision: "Target DB registration deletion is a soft delete; update is
        PATCH semantics; a connection-mode narrowing that would strand an
        existing grant is refused (409); identity changes carry matching
        QueryData rows in the same transaction."
      rationale: "Databases.id is referenced by three tables and QueryData
        matches by text pair with no FK; a hard delete or an unguarded
        identity change would silently orphan audit history or saved
        workspaces."
      recorded_in: "docs/specs/SPEC-0027-target-database-lifecycle.md,
        docs/adr/ADR-0021-target-database-soft-delete.md"
    - decision: "ruff's F and E9 rules become a blocking CI merge gate; the
        rest of ruff stays informational. A frontend CI job is added with all
        four of its checks blocking."
      rationale: "F/E9 are correctness rules, not style. The audit found three
        live F821s that informational lint had been reporting unheeded for
        weeks. With static_files removed the selection is clean today, so the
        gate blocks no accumulated debt. The frontend checks all pass today
        too, so gating them costs nothing now and prevents the same drift."
      recorded_in: "docs/adr/ADR-0002-ci-merge-gate-policy.md (2026-08-30
        amendment)"
    - decision: "Dependency scanning (pip-audit, npm audit) is added but
        informational."
      rationale: "The open advisories need version upgrades and one library
        replacement, each deserving its own verification. Gating before those
        land would put a red CI in front of every unrelated change."
      recorded_in: "docs/adr/ADR-0002-ci-merge-gate-policy.md (2026-08-30
        amendment)"
    - decision: "The full SQL text keeps going to Slack, now with a 2700-char
        cap."
      rationale: "An approver cannot judge a query they cannot read; masking
        the literals would look readable while hiding the statement's scope,
        which is worse than sending nothing. The cap exists because Slack
        rejects the whole payload over 3000 chars, so long queries were
        silently producing no notification at all."
      recorded_in: "docs/adr/ADR-0019-slack-approval-payload.md"
    - decision: "AuditLog append-only is enforced at the ORM layer, and the
        database-level gap is documented rather than papered over."
      rationale: "An ORM guard stops application bugs, which is real value,
        but it cannot stop a session holding the app's own DB credentials.
        Claiming more than that would be worse than the original gap."
      recorded_in: "docs/adr/ADR-0009-audit-log-foundation.md (2026-08-30
        addendum)"
    - decision: "UserDatabaseAssociation.is_admin is derived from `role` by a
        mapper event rather than being dropped or left to call sites."
      rationale: "Five call sites write it today and all are currently
        correct; the risk is the sixth. Dropping the column would be a wider
        schema and API change than the finding warrants."
      recorded_in: "This handoff; behaviour covered by
        tests/unit/test_association_is_admin_mirror.py"

