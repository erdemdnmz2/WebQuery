  decisions:
    - decision: "Karma SELECT; UPDATE batch'leri REDDEDİLMİYOR. Kademe
        tutarlılığı kontrolü yalnız DDL karışımına daraltıldı."
      rationale: "Planın 3.2.2 kod örneği bütün karma kademeli batch'leri
        reddediyordu. Bu batch tek bağlantıda, tek transaction'da, zaten hem
        okuyup hem yazabilen rw hesabıyla çalışır; bölmek atomikliği bedelsiz
        kaybettirir ve gündelik bir iş akışını bozar. Rol kontrolü ve kademe
        seçimi zaten her ifadeyi ayrı ayrı değerlendirdiği için onaylayan
        yanıltılmıyor. DDL karışımı ayrı: farklı ve daha yetkili bir hesapla
        çalışır ve tek sınıflandırmayla incelenmesi güçtür."
      recorded_in: "docs/adr/ADR-0016-analyzer-block-boundary.md"
    - decision: "Riskler iki sınıfa ayrıldı; RiskLevel'a blocked_operation eklendi."
      rationale: "WHERE'siz bir DELETE meşru olabilir ve insan kararı gerektirir;
        xp_cmdshell için WebQuery'de desteklenen bir yol yoktur. İkisini aynı
        mekanizmayla ele almak hem yasağı atlatılabilir kılıyor hem de onay
        kuyruğunu sıradan sorgularla dolduruyordu."
      recorded_in: "docs/adr/ADR-0016-analyzer-block-boundary.md"
    - decision: "MAX_JOINS varsayılanı 8 ve karşılaştırma > yapıldı."
      rationale: "Eski kod >= ile karşılaştırdığı için MAX_JOINS adı yanıltıcıydı:
        3 ayarı üç JOIN'i de engelliyordu. Ayar adı artık izin verilen en yüksek
        sayıyı ifade ediyor. Onay kuyruğunun sinyal kalitesi bir güvenlik
        özelliğidir; sıradan raporlama sorguları kuyruğa düşmemeli."
      recorded_in: "docs/specs/SPEC-0019-query-analyzer-hardening.md"
    - decision: "Sert bloklar workspace ve admin önizleme yollarına da eklendi;
        yalnız sert blok alt kümesi uygulanıyor, tam analyze() kapısı değil."
      rationale: "Bu iki yol da hedef veritabanında ifade yürütüyor ve analyze()
        çağırmıyordu; admin bu yollardan sert bloğu atlayabilirdi. Tam kapı
        koymak, admin'in bilerek onayladığı riskli sorgunun tekrar
        çalıştırılmasını kırardı."
      recorded_in: "docs/adr/ADR-0016-analyzer-block-boundary.md"
    - decision: "Hedef DB credential modeli DEĞİŞMİYOR: ro + rw, opsiyonel ddl."
      rationale: "Oturum başında ro_rw + ddl birleştirmesi tartışıldı. Öne
        sürülen üç gerekçeden ikisinin kodda karşılığı olmadığı görüldü: iki
        aşamalı oku-sonra-yaz akışı yok (required_tier batch'in tamamını tek
        kademeye çözüyor) ve sorgu başına ek round trip yok. Üçüncüsü, hesap
        sayısı, ölçüldüğünde eşit çıktı: varsayılan kurulum her iki modelde de
        iki hesap. OQ-2026-002 ve OQ-2026-007 Answered kalıyor; ADR-0005 ve
        SPEC-0002 geçerli, superseding gerekmedi."
      recorded_in: "docs/adr/ADR-0005-role-based-target-database-credentials.md (değişmedi)"

