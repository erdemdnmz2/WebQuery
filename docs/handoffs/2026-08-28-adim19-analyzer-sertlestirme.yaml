    yani üç tabloyu birleştiren normal bir raporlama sorgusu onay kuyruğuna
    düşüyordu.

    Üstüne, `if not query_analysis["return"] and not is_db_admin` koşulu
    nedeniyle veritabanı admin'i bu kontrollerin tamamını atlıyordu.

