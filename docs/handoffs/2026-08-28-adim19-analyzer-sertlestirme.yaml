  context: |
    Adım 19, uygulama planındaki 3.2 bloğudur ve 3.3 (sqlglot 30.14.0
    yükseltmesi, commit c2edf4b) üzerine yazılmıştır.

    Bloğun gerekçesi çift yönlüydü. Analizci bir yandan gerçekten tehlikeli
    olanı kaçırıyordu: `_check_sql_injection` yalnız `exp.Command` düğümlerine
