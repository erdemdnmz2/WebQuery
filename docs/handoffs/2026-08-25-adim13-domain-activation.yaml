  task: "Adım 13 (2.2) — şirket domainiyle kayıt, pasif kullanıcı ve platform aktivasyonu"

  summary: >-
    Şirket domaini allowlist'inde bulunan kullanıcıların kayıt sırasında Users
    tablosuna oluşturulması, varsayılan olarak pasif tutulması ve platform
    yöneticisinin kullanıcıyı etkinleştirebilmesi için backend ve frontend
    altyapısı hazırlandı. Kullanıcıyı etkinleştirmek DB erişimi veya rol vermek
    anlamına gelmez; bu iki işlem ayrı tutuldu.

  scope:
    completed:
      - >-
        ALLOWED_EMAIL_DOMAINS ile backend tarafında normalize edilmiş, tam
        eşleşmeli ve fail-closed domain kontrolü eklendi.
      - >-
        İzin verilen domain'den gelen kayıt Users tablosunda oluşturuluyor;
        REGISTRATION_REQUIRES_ACTIVATION=true iken kullanıcı is_active=false
        olarak başlıyor.
      - >-
        PLATFORM_ADMINS allowlist'i ve platform_admin_required bağımlılığı
        eklendi. Bu kapsam bilinçli olarak gerçek OWNER rolü yerine geçici
        platform yetkisi olarak tanımlandı.
      - >-
        GET /api/admin/users ile kullanıcı listesi ve
        POST /api/admin/users/{user_id}/enable ile etkinleştirme uçları eklendi.
        Etkinleştirme disabled_at/disabled_by alanlarını temizliyor ve
        USER_ENABLED audit kaydı oluşturuyor.
      - >-
        Frontend kayıt ekranında backend'in bekleyen aktivasyon mesajı
        gösteriliyor; otomatik giriş varsayılmıyor.
      - >-
        Platform yöneticileri için Users sekmesi, bekleyen kullanıcı listesi
        ve etkinleştirme aksiyonu eklendi.
      - >-
        Davranış SPEC-0016 ve karar ADR-0013 içinde kayda alındı; dışarıdaki
        uygulama sırası dokümanında Adım 13 bu akışa göre güncellendi.
    excluded:
      - >-
        Gerçek OWNER rolü, OWNER bootstrap akışı veya is_platform_owner veri
        modeli uygulanmadı; bunlar Adım 20 kapsamındadır.
      - >-
        Kullanıcıya DB rolü/DB erişimi verme akışı değiştirilmedi. Mevcut
        associate_user akışı ayrı bir yetkilendirme adımı olarak korunuyor.
      - >-
        E-posta doğrulama, davet gönderme ve mailbox sahipliği doğrulaması
        uygulanmadı.
      - >-
        Production/staging migration çalıştırılmadı. Adım 13, Adım 12'deki
        is_active migration'ını önkoşul olarak kullanıyor.

