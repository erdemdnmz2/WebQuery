        dialect'lerde tabloyu yeniden yazmanın karşılığı yok. Testler SQLite
        üzerinde koştuğu için migration orada no-op olarak geçer ve zincirde
        kaldığı ayrıca doğrulanır.
      recorded_in: "docs/specs/SPEC-0012-masking-truthfulness-and-uuid-normalisation.md"
    - decision: "Red gerekçesi istemcide de doğrulanıyor"
      rationale: >-
        Sunucu kuralın kaynağıdır, ama gövde 422 ile dönerse kullanıcı yazdığı
        gerekçeyi kaybeder. İstemci doğrulaması sunucununkinin yerine geçmez,
        önüne geçer.
