  decisions:
    - decision: "Krom akromatik tutuldu; kroma yalnızca duruma ayrıldı, birincil eylem mürekkep rengi oldu"
      rationale: "Üretim veritabanına giden bir onay düğmesi, bir risk rozetiyle dikkat için yarışmamalı"
      recorded_in: "docs/specs/SPEC-0010-frontend-design-system.md (BR-01)"
    - decision: "Tailwind v4 + CSS token katmanı + Radix primitives"
      rationale: "Kapalı ağ uyumluluğu ve tedarik zinciri yüzeyi belirleyici kriterdi; @theme inline temayı yeniden derlemesiz kılıyor"
      recorded_in: "docs/adr/ADR-0010-frontend-design-system.md"
    - decision: "Ace Editor yerine CodeMirror 6"
      rationale: "Ace'in sabit dracula teması açık temayla uyumsuzdu ve CDN'den yükleniyordu"
      recorded_in: "docs/adr/ADR-0010-frontend-design-system.md"
    - decision: "Arayüz dili Türkçede birleştirildi"
      rationale: "Yönetim ve maskeleme ekranları zaten Türkçeydi; karışık dil kullanıcı için tutarsızdı"
      recorded_in: "docs/adr/ADR-0010-frontend-design-system.md (Accepted Risks)"
    - decision: "pages/ConnectDb.tsx silindi"
      rationale: "Hiçbir rotadan erişilemiyordu ve var olmayan /api/mssql-connect uç noktasına istek atıyordu"
      recorded_in: "docs/adr/ADR-0010-frontend-design-system.md (Consequences)"

  validation:
    commands_run:
      - command: "npx tsc --noEmit"
        result: "passed"
        evidence: "strict, noUnusedLocals, noUnusedParameters açık; 0 hata"
      - command: "npm run build"
        result: "passed"
        evidence: "vite 6.4.3, 4745 modül; ilk yük index 488 kB / 150 kB gzip, editor ve xlsx tembel yükleniyor"
      - command: "npm run audit:contrast"
        result: "passed"
        evidence: "64 kontrol (32 renk çifti x 2 tema); tüm metin çiftleri >= 4.5:1, tüm kontrol kenarları >= 3:1"
      - command: "manuel tarayıcı doğrulaması (vite dev + geçici API mock'u)"
        result: "passed"
        evidence: "Login, Workspaces, Studio (çalıştırma + sonuç ızgarası + maskeleme penceresi), RunWorkspace, Admin (onaylar + şema ağacı) her iki temada ve 375/1400 px genişlikte kontrol edildi; mock ve geçici import silindi"
      - command: "pytest (web_api)"
        result: "not-run"
        evidence: "Backend'e dokunulmadı; ayrıca çalışma ağacında bu oturuma ait olmayan web_api değişiklikleri var (aşağıya bakın)"

  open_questions:
    - id: "OQ-2026-002"
      status: "Deferred"
      question: "Runtime hedef DB bağlantısında merkezi credential mı, veritabanı başına credential mı kullanılacak? Kullanıcı 2026-08-24'te erteledi; bu iş backend davranışına dokunmuyor."

  known_risks:
