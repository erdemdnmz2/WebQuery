# P1-12: security headers and edge rate limiting were entirely absent.
#
# TLS is not turned on here by default: doing so would require a certificate
# this repository cannot ship, and an nginx.conf that references a cert file
# that does not exist fails to start at all — breaking every existing
# deployment that runs behind its own TLS-terminating load balancer or
# reverse proxy in front of this one. A commented HTTPS server block is
# provided below; mount real certificates and enable it for a deployment
# where nginx itself terminates TLS.

# Two zones: the login endpoint specifically (bcrypt is expensive; Adım 14's
# Redis throttle is the real defense but the edge should not forward
# unlimited attempts to it either) and the API in general.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

server {
    listen 80;
    server_name localhost;

    # Applied to every response from this server, including the SPA build.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' on style-src covers Tailwind's runtime-injected rules;
    # tightening it further needs a nonce plumbed through the SPA build.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

