version: '3.8'

# Production-safe baseline (OQ-2026-015). Local development conveniences —
# live code reload and direct database access — live in
# docker-compose.override.yml, which Compose loads automatically alongside
# this file; nothing here needs to change to get them back for local work.

services:
  web:
    build: ./web_api
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - APP_DATABASE_URL=mssql+aioodbc://${DB_USER}:${DB_PASSWORD}@db/dba_application_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes&connection timeout=30
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - REDIS_URL=redis://redis:6379/0
      # nginx is the only container talking to `web` directly; trust it and
      # nothing else so X-Forwarded-For cannot be forged from outside the
      # compose network. See web_api/middlewares/proxy_middleware.py.
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-172.16.0.0/12}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    # No bind mount: the image built above is what runs, so what was tested
    # is what ships. No direct host port publish either — nginx is the only
    # ingress; reach the API through it, not around it.
    restart: always

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      # The mssql container bootstraps its own `sa` account from this value;
      # create_db.py then uses it once to provision the application's own
      # login and database (see web_api/create_db.py). DB_USER has no
      # fallback: an unset value must fail config_guard's startup check
      # instead of silently becoming `sa`.
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    # No host port publish: reachable only from other containers on this
    # compose network, not from the host or beyond it.
    restart: always

  frontend:
    build: ./frontend
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - frontend
    restart: always

volumes:
  sql_data:
