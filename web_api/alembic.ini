[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Connection string is resolved at runtime in migrations/env.py from
# APP_DATABASE_URL (see docs/adr/ADR-0001-schema-migrations-alembic.md).
# No secrets belong in this file.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
